# Update CSVs from XLSX files

name: Update CSVs from XLSX

on:
  # Allows running manually
  workflow_dispatch:

  pull_request:
    branches: ['tr_EN']
    paths:
      - '**.xlsx'

jobs:
  update:
    runs-on: ubuntu-latest
    container: ghcr.io/variantxyz/sakura-wars-gb2:tr_EN

    steps:
      - name: List versions
        run: |
          git --version
          python3 --version
          rgbasm --version
          rgblink --version
          rgbgfx --version

      - name: Checkout main repository
        uses: actions/checkout@v2
        with:
          path: 'sakura-wars-gb2'

      # The branch must exist on the main repository for this to work
      - name: Switch branch if pull request
        if: github.event_name == 'pull_request'
        working-directory: 'sakura-wars-gb2'
        run: |
          git fetch origin ${{ github.head_ref }}:${{ github.head_ref }}
          git checkout ${{ github.head_ref }}

      - name: Update CSV
        working-directory: 'sakura-wars-gb2'
        run: |
          make update_csv

      - name: Commit if there are changes
        working-directory: 'sakura-wars-gb2'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add game/text
          git commit -C HEAD && git push -u origin HEAD || echo "No text changes"